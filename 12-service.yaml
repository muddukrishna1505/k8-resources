apiVersion: v1
kind: Service
metadata:
  name: nginx-service #service name
  labels:
    project: roboshop
    environment: dev

spec:
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
    - type: TCP
      port: 80 #service port
      targetPort: 80 #container port
---
apiVersion: v1
kind: Pod
metadata: 
  name: nginx-pod #pod name
  labels:
    project: roboshop
    environment: dev
    tier: frontend
    component: frontend
spec:
  containers:
  - name: nginx #container name
    image: nginx #image
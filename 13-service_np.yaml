apiVersion: v1
kind: Service
metadata:
  name: service-nodeport 
  labels:
    project: roboshop
    environment: dev
spec:
  type: NodePort
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: frontend
    component: frontend    
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80 #container port
      nodePort: 30008 #node port  